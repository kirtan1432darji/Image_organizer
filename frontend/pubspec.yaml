name: ai_screenshot_organizer
description: "ContextVault - Turn Screenshots into Searchable Knowledge"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Navigation & Routing
  go_router: ^14.2.0
  
  # Network & REST API
  dio: ^5.4.3+1
  http: ^1.2.1
  
  # Local Database & Storage
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  
  # Media & Gallery Access (non-destructive metadata extraction)
  photo_manager: ^3.1.0
  permission_handler: ^11.3.1
  
  # UI & Styling
  google_fonts: ^6.2.1
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  uuid: ^4.4.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
